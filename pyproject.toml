[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor-pilot"
version = "0.1.0"
description = "只读重构审计工具：S1 扫描 + S2 审计 + 召回率自检"
requires-python = ">=3.10"
# 运行时依赖尽可能为零（12.0）：工具必须跑在自己的环境里，绝不能装进被审计项目的环境。
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.scripts]
refactor-pilot = "refactor_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = false

# tomllib / tomli 二选一兜底（12.0）：目标版本标 3.10，两个名字都可能查不到 stub
[[tool.mypy.overrides]]
module = ["tomllib", "tomli"]
ignore_missing_imports = true
